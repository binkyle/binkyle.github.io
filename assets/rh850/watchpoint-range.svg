<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590" role="img" aria-labelledby="title desc"><title id="title">观察区间与可疑返回槽必须逐字对齐</title><desc id="desc">位置按相对顺序绘制；未按字节数等比例缩放。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#237b79"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a13c35"/></marker></defs><rect width="1040" height="590" rx="20" fill="#ffffff"/><path d="M36 91H1004" stroke="#cbdad9"/><text x="36" y="43" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="700"><tspan x="36" dy="0">观察区间与可疑返回槽必须逐字对齐</tspan></text><text x="36" y="73" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="36" dy="0">位置按相对顺序绘制；未按字节数等比例缩放。</tspan></text><rect x="50" y="120" width="685" height="55" fill="#ffffff" stroke="#cbdad9"/><text x="70" y="155" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400"><tspan x="70" dy="0">B</tspan></text><text x="255" y="155" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="255" dy="0">共享栈边界</tspan></text><rect x="50" y="181" width="685" height="55" fill="#ffffff" stroke="#cbdad9"/><text x="70" y="216" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400"><tspan x="70" dy="0">B−0x04</tspan></text><text x="255" y="216" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="255" dy="0">观察区间的高端，不包含此地址</tspan></text><rect x="50" y="242" width="685" height="55" fill="#eef6f4" stroke="#cbdad9"/><text x="70" y="277" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400"><tspan x="70" dy="0">B−0x08</tspan></text><text x="255" y="277" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="255" dy="0">W 内：一个 32 位字</tspan></text><rect x="50" y="303" width="685" height="55" fill="#eef6f4" stroke="#cbdad9"/><text x="70" y="338" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400"><tspan x="70" dy="0">B−0x0C</tspan></text><text x="255" y="338" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="255" dy="0">W 起点：另一个 32 位字</tspan></text><rect x="50" y="364" width="685" height="55" fill="#fbf3e7" stroke="#cbdad9"/><text x="70" y="399" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400"><tspan x="70" dy="0">B−0x20</tspan></text><text x="255" y="399" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="255" dy="0">可疑数据槽之一，不在 W 内</tspan></text><rect x="50" y="425" width="685" height="55" fill="#fbf3e7" stroke="#cbdad9"/><text x="70" y="460" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400"><tspan x="70" dy="0">B−0x28</tspan></text><text x="255" y="460" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="255" dy="0">可疑数据槽之二，不在 W 内</tspan></text><rect x="775" y="240" width="225" height="110" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="791" y="269" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="791" dy="0">W · Length=8</tspan></text><text x="791" y="296" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="791" dy="0">[B−0x0C, B−0x04)</tspan><tspan x="791" dy="24.0">长度 ≠ 单次写入宽度</tspan></text><rect x="775" y="390" width="225" height="110" rx="12" fill="#fbf3e7" stroke="#3a6598" stroke-width="1.4"/><text x="791" y="419" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="791" dy="0">后续需另设观察点</tspan></text><text x="791" y="446" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="791" dy="0">对准实际被消费的字</tspan><tspan x="791" dy="24.0">再捕获它的写入者</tspan></text><path d="M735,275 L775,275" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M735,448 L775,448" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="570" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="13" font-weight="400"><tspan x="36" dy="0">RH850 / U2A · 机制示意，具体实现与现场需分别核对</tspan></text></svg>