<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc"><title id="title">相邻栈的物理关系与保护窗口</title><desc id="desc">B 为共享边界；以下只展示相对关系，不按容量绘制比例。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#237b79"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a13c35"/></marker></defs><rect width="1040" height="580" rx="20" fill="#ffffff"/><path d="M36 91H1004" stroke="#cbdad9"/><text x="36" y="43" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="700"><tspan x="36" dy="0">相邻栈的物理关系与保护窗口</tspan></text><text x="36" y="73" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="36" dy="0">B 为共享边界；以下只展示相对关系，不按容量绘制比例。</tspan></text><text x="65" y="129" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="65" dy="0">高地址</tspan></text><rect x="180" y="145" width="410" height="170" fill="#eef6f4" stroke="#237b79"/><text x="200" y="177" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="21" font-weight="600"><tspan x="200" dy="0">TaskB 栈 · [B, B+0x800)</tspan></text><text x="200" y="213" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="200" dy="0">初始 SP 位于高地址一侧</tspan><tspan x="200" dy="27.0">栈向低地址增长</tspan></text><path d="M550,174 L550,286" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><line x1="155" y1="315" x2="620" y2="315" stroke="#a13c35" stroke-width="1.5"/><text x="120" y="322" text-anchor="start" fill="#a13c35" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="20" font-weight="700"><tspan x="120" dy="0">B</tspan></text><rect x="180" y="315" width="410" height="160" fill="#fbf3e7" stroke="#3a6598"/><text x="200" y="350" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="21" font-weight="600"><tspan x="200" dy="0">TaskA 栈 · [B−0x800, B)</tspan></text><line x1="180" y1="405" x2="590" y2="405" stroke="#a13c35" stroke-width="1.5" stroke-dasharray="6 4"/><text x="200" y="434" text-anchor="start" fill="#a13c35" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="200" dy="0">记录中的 TaskB Dyn.SP = B−0xE8</tspan></text><text x="65" y="497" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="65" dy="0">低地址</tspan></text><rect x="655" y="150" width="340" height="125" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="671" y="179" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="671" dy="0">案例 Region0 用于任务栈</tspan></text><text x="671" y="206" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="671" dy="0">切换时更新边界与属性</tspan><tspan x="671" dy="24.0">硬件有效权限需进一步核对</tspan></text><rect x="655" y="327" width="340" height="145" rx="12" fill="#fff0ed" stroke="#a13c35" stroke-width="1.4"/><text x="671" y="356" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="671" dy="0">232 字节的越界保存值</tspan></text><text x="671" y="383" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="671" dy="0">有效性取决于初始化、任务身份</tspan><tspan x="671" dy="24.0">以及保存时刻。</tspan><tspan x="671" dy="24.0">不自动等于 MEMF 瞬间的 r3。</tspan></text><path d="M590,405 L655,405" fill="none" stroke="#a13c35" stroke-width="2" marker-end="url(#redarrow)"/><text x="36" y="560" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="13" font-weight="400"><tspan x="36" dy="0">RH850 / U2A · 机制示意，具体实现与现场需分别核对</tspan></text></svg>