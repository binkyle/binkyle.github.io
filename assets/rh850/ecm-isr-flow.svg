<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690" role="img" aria-labelledby="title desc"><title id="title">从入口走到通知或不一致诊断</title><desc id="desc">流程保留检查分支；进入 ISR 不代表已执行正常清除。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#237b79"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a13c35"/></marker></defs><rect width="1040" height="690" rx="20" fill="#ffffff"/><path d="M36 91H1004" stroke="#cbdad9"/><text x="36" y="43" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="700"><tspan x="36" dy="0">从入口走到通知或不一致诊断</tspan></text><text x="36" y="73" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="36" dy="0">流程保留检查分支；进入 ISR 不代表已执行正常清除。</tspan></text><rect x="320" y="120" width="400" height="75" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="336" y="149" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="336" dy="0">EIC9 入口：路由、屏蔽与原始状态</tspan></text><rect x="320" y="245" width="400" height="90" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="336" y="274" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="336" dy="0">按组过滤并聚合有效位</tspan></text><text x="336" y="301" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="336" dy="0">Master / Checker 分别参与采样</tspan></text><path d="M520,195 L520,245" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="420" width="410" height="100" rx="12" fill="#fff0ed" stroke="#a13c35" stroke-width="1.4"/><text x="61" y="449" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="61" dy="0">配置不匹配或有效状态为零</tspan></text><text x="61" y="476" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="61" dy="0">报告 INCONSISTENT / FAILED</tspan></text><rect x="585" y="420" width="410" height="100" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="601" y="449" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="601" dy="0">存在有效处理位</tspan></text><text x="601" y="476" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="601" dy="0">按组 / 位计算编号，调用通知</tspan></text><path d="M420,335 L420,375 L250,375 L250,420" fill="none" stroke="#a13c35" stroke-width="2" marker-end="url(#redarrow)"/><path d="M620,335 L620,375 L790,375 L790,420" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><text x="65" y="393" text-anchor="start" fill="#a13c35" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="65" dy="0">不满足条件</tspan></text><text x="800" y="393" text-anchor="start" fill="#237b79" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="800" dy="0">满足条件</tspan></text><rect x="585" y="562" width="410" height="73" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="601" y="591" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="601" dy="0">保护开窗 → W1C 清除 → 恢复保护</tspan></text><path d="M790,520 L790,562" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="575" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="45" dy="0">诊断分支的后续行为需核对当前实现；</tspan><tspan x="45" dy="25.5">不能假定它执行了右侧清除步骤。</tspan></text><text x="36" y="670" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="13" font-weight="400"><tspan x="36" dy="0">RH850 / U2A · 机制示意，具体实现与现场需分别核对</tspan></text></svg>