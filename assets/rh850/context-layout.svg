<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc"><title id="title">Context 保存的是恢复所需的状态</title><desc id="desc">案例布局：9 个 32 位字段，整体 0x24 字节；偏移不是跨版本接口。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#237b79"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a13c35"/></marker></defs><rect width="1040" height="640" rx="20" fill="#ffffff"/><path d="M36 91H1004" stroke="#cbdad9"/><text x="36" y="43" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="700"><tspan x="36" dy="0">Context 保存的是恢复所需的状态</tspan></text><text x="36" y="73" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="36" dy="0">案例布局：9 个 32 位字段，整体 0x24 字节；偏移不是跨版本接口。</tspan></text><rect x="44" y="120" width="550" height="45" fill="#eef6f4" stroke="#cbdad9"/><text x="60" y="149" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="60" dy="0">0x00</tspan></text><text x="165" y="149" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="165" dy="0">PC</tspan></text><text x="350" y="149" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">执行恢复点</tspan></text><rect x="44" y="165" width="550" height="45" fill="#eef6f4" stroke="#cbdad9"/><text x="60" y="194" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="60" dy="0">0x04</tspan></text><text x="165" y="194" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="165" dy="0">PSW</tspan></text><text x="350" y="194" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">处理器状态</tspan></text><rect x="44" y="210" width="550" height="45" fill="#eef6f4" stroke="#cbdad9"/><text x="60" y="239" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="60" dy="0">0x08</tspan></text><text x="165" y="239" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="165" dy="0">PMR</tspan></text><text x="350" y="239" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">HAL 中断屏蔽状态</tspan></text><rect x="44" y="255" width="550" height="45" fill="#eef6f4" stroke="#cbdad9"/><text x="60" y="284" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="60" dy="0">0x0C</tspan></text><text x="165" y="284" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="165" dy="0">LP / r31</tspan></text><text x="350" y="284" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">保存的链接寄存器</tspan></text><rect x="44" y="300" width="550" height="45" fill="#eef6f4" stroke="#cbdad9"/><text x="60" y="329" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="60" dy="0">0x10</tspan></text><text x="165" y="329" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="165" dy="0">SP / r3</tspan></text><text x="350" y="329" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">保存的栈指针</tspan></text><rect x="44" y="345" width="550" height="45" fill="#fbf3e7" stroke="#cbdad9"/><text x="60" y="374" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="60" dy="0">0x14</tspan></text><text x="165" y="374" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="165" dy="0">MPLA0</tspan></text><text x="350" y="374" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">案例栈区域下界</tspan></text><rect x="44" y="390" width="550" height="45" fill="#fbf3e7" stroke="#cbdad9"/><text x="60" y="419" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="60" dy="0">0x18</tspan></text><text x="165" y="419" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="165" dy="0">MPUA0</tspan></text><text x="350" y="419" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">案例栈区域上界</tspan></text><rect x="44" y="435" width="550" height="45" fill="#fbf3e7" stroke="#cbdad9"/><text x="60" y="464" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="60" dy="0">0x1C</tspan></text><text x="165" y="464" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="165" dy="0">ASID</tspan></text><text x="350" y="464" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">HAL 身份抽象</tspan></text><rect x="44" y="480" width="550" height="45" fill="#fbf3e7" stroke="#cbdad9"/><text x="60" y="509" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="60" dy="0">0x20</tspan></text><text x="165" y="509" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="165" dy="0">PARAM</tspan></text><text x="350" y="509" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">启动 / 调用参数</tspan></text><rect x="650" y="155" width="335" height="115" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="666" y="184" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="666" dy="0">Context 对象</tspan></text><text x="666" y="211" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="666" dy="0">保存恢复点、SP、LP</tspan><tspan x="666" dy="24.0">以及保护相关状态</tspan></text><rect x="650" y="310" width="335" height="145" rx="12" fill="#fbf3e7" stroke="#3a6598" stroke-width="1.4"/><text x="666" y="339" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="666" dy="0">任务栈</tspan></text><text x="666" y="366" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="666" dy="0">函数帧、保存寄存器、返回链</tspan><tspan x="666" dy="24.0">与 Context 共同构成恢复信息</tspan><tspan x="666" dy="24.0">对象布局与栈布局分开检查</tspan></text><path d="M760,270 L760,310" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><text x="660" y="514" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="660" dy="0">Context ≠ 完整寄存器转储</tspan><tspan x="660" dy="27.0">不同入口可能保存不同状态</tspan></text><text x="36" y="620" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="13" font-weight="400"><tspan x="36" dy="0">RH850 / U2A · 机制示意，具体实现与现场需分别核对</tspan></text></svg>