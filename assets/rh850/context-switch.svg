<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc"><title id="title">保存当前任务，恢复下一任务</title><desc id="desc">职责示意：编译器、OS C 层与汇编入口共同完成。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#237b79"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a13c35"/></marker></defs><rect width="1040" height="580" rx="20" fill="#ffffff"/><path d="M36 91H1004" stroke="#cbdad9"/><text x="36" y="43" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="700"><tspan x="36" dy="0">保存当前任务，恢复下一任务</tspan></text><text x="36" y="73" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="36" dy="0">职责示意：编译器、OS C 层与汇编入口共同完成。</tspan></text><rect x="45" y="120" width="420" height="90" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="61" y="149" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="61" dy="0">当前任务 · 保存入口</tspan></text><text x="61" y="176" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="61" dy="0">保存寄存器与返回链到当前栈</tspan></text><rect x="45" y="260" width="420" height="90" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="61" y="289" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="61" dy="0">当前 Dyn</tspan></text><text x="61" y="316" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="61" dy="0">保存实现要求的 LP、状态与保护字段</tspan></text><path d="M255,210 L255,260" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><rect x="570" y="120" width="420" height="90" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="586" y="149" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="586" dy="0">下一任务 · 已有 Dyn 与栈</tspan></text><text x="586" y="176" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="586" dy="0">首次初始化状态或此前保存状态</tspan></text><rect x="570" y="260" width="420" height="90" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="586" y="289" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="586" dy="0">装载下一任务的保护配置</tspan></text><text x="586" y="316" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="586" dy="0">栈区域、属性、身份与必要同步</tspan></text><rect x="570" y="407" width="420" height="90" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="586" y="436" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="586" dy="0">恢复执行</tspan></text><text x="586" y="463" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="586" dy="0">装载状态与 SP，恢复寄存器与执行点</tspan></text><path d="M780,210 L780,260" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M780,350 L780,407" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M465,305 L570,305" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="430" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="45" dy="0">切换期间的中断屏蔽、特权与同步</tspan><tspan x="45" dy="27.0">以目标 HAL 的实际顺序为准。</tspan><tspan x="45" dy="27.0">不能把示意流程替换为安全关键代码。</tspan></text><text x="36" y="560" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="13" font-weight="400"><tspan x="36" dy="0">RH850 / U2A · 机制示意，具体实现与现场需分别核对</tspan></text></svg>