<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc"><title id="title">ECM 的三条通知路径分开追踪</title><desc id="desc">EIC9 对应 DCLS 路径；普通 ECM EI 级通知使用 EIINT8。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#237b79"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a13c35"/></marker></defs><rect width="1040" height="610" rx="20" fill="#ffffff"/><path d="M36 91H1004" stroke="#cbdad9"/><text x="36" y="43" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="700"><tspan x="36" dy="0">ECM 的三条通知路径分开追踪</tspan></text><text x="36" y="73" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="36" dy="0">EIC9 对应 DCLS 路径；普通 ECM EI 级通知使用 EIINT8。</tspan></text><rect x="42" y="125" width="270" height="130" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="58" y="154" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="58" dy="0">ECM Master / Checker</tspan></text><text x="58" y="181" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="58" dy="0">锁存源状态</tspan><tspan x="58" dy="24.0">按配置选择错误反应</tspan></text><rect x="390" y="120" width="265" height="84" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="406" y="149" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="406" dy="0">普通 EI 级通知</tspan></text><text x="406" y="176" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="406" dy="0">INTECMME → EIINT8</tspan></text><rect x="390" y="260" width="265" height="84" rx="12" fill="#fbf3e7" stroke="#3a6598" stroke-width="1.4"/><text x="406" y="289" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="406" dy="0">DCLS 错误通知</tspan></text><text x="406" y="316" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="406" dy="0">INTECMDCLSMI → EIINT9</tspan></text><rect x="390" y="400" width="265" height="84" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="406" y="429" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="406" dy="0">FE 级通知</tspan></text><text x="406" y="456" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="406" dy="0">INTECMNMI → FEINT</tspan></text><rect x="730" y="260" width="268" height="130" rx="12" fill="#fbf3e7" stroke="#3a6598" stroke-width="1.4"/><text x="746" y="289" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="746" dy="0">本案例的 EIC9 配置</tspan></text><text x="746" y="316" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="746" dy="0">INTC1 / ch9 / Core0</tspan><tspan x="746" dy="24.0">优先级配置值 1 / CAT1</tspan></text><path d="M312,180 L350,180 L350,162 L390,162" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M312,215 L350,215 L350,302 L390,302" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M312,245 L335,245 L335,442 L390,442" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M655,302 L730,302" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><text x="42" y="537" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="42" dy="0">事件请求可以重复；通道号、优先级值均不是周期。</tspan></text><text x="36" y="590" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="13" font-weight="400"><tspan x="36" dy="0">RH850 / U2A · 机制示意，具体实现与现场需分别核对</tspan></text></svg>