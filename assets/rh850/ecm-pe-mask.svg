<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530" role="img" aria-labelledby="title desc"><title id="title">PE 路由字段与软件掩码是两层信息</title><desc id="desc">以下组号来自案例驱动配置，不是所有 U2A 工程的固定布局。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#237b79"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a13c35"/></marker></defs><rect width="1040" height="530" rx="20" fill="#ffffff"/><path d="M36 91H1004" stroke="#cbdad9"/><text x="36" y="43" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="700"><tspan x="36" dy="0">PE 路由字段与软件掩码是两层信息</tspan></text><text x="36" y="73" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="36" dy="0">以下组号来自案例驱动配置，不是所有 U2A 工程的固定布局。</tspan></text><rect x="42" y="135" width="275" height="94" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="58" y="164" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="58" dy="0">读取 EIBD9 相关字段</tspan></text><text x="58" y="191" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="58" dy="0">解码得到所选 PE</tspan></text><rect x="42" y="301" width="275" height="110" rx="12" fill="#fbf3e7" stroke="#3a6598" stroke-width="1.4"/><text x="58" y="330" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="58" dy="0">同时记录实际执行 PE</tspan></text><text x="58" y="357" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="58" dy="0">路由字段 ≠ 实时 PEID</tspan><tspan x="58" dy="24.0">需要分别采样后核对</tspan></text><path d="M317,181 L385,181" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><rect x="385" y="125" width="600" height="62" fill="#eef6f4" stroke="#cbdad9"/><text x="405" y="164" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="20" font-weight="600"><tspan x="405" dy="0">PE0 / default</tspan></text><text x="675" y="164" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400"><tspan x="675" dy="0">mask[7] 添加对应位</tspan></text><rect x="385" y="193" width="600" height="62" fill="#ffffff" stroke="#cbdad9"/><text x="405" y="232" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="20" font-weight="600"><tspan x="405" dy="0">PE1</tspan></text><text x="675" y="232" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400"><tspan x="675" dy="0">mask[8] 添加对应位</tspan></text><rect x="385" y="261" width="600" height="62" fill="#eef6f4" stroke="#cbdad9"/><text x="405" y="300" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="20" font-weight="600"><tspan x="405" dy="0">PE2</tspan></text><text x="675" y="300" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400"><tspan x="675" dy="0">mask[9] 添加对应位</tspan></text><rect x="385" y="329" width="600" height="62" fill="#ffffff" stroke="#cbdad9"/><text x="405" y="368" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="20" font-weight="600"><tspan x="405" dy="0">PE3</tspan></text><text x="675" y="368" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400"><tspan x="675" dy="0">mask[10] 添加对应位</tspan></text><text x="385" y="446" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="385" dy="0">数组长度 11，已列访问最大下标 10。</tspan></text><text x="36" y="510" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="13" font-weight="400"><tspan x="36" dy="0">RH850 / U2A · 机制示意，具体实现与现场需分别核对</tspan></text></svg>