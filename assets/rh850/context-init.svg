<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">静态配置如何成为首次运行状态</title><desc id="desc">Config 提供初值；Dyn 在初始化和后续切换中更新。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#237b79"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a13c35"/></marker></defs><rect width="1040" height="470" rx="20" fill="#ffffff"/><path d="M36 91H1004" stroke="#cbdad9"/><text x="36" y="43" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="700"><tspan x="36" dy="0">静态配置如何成为首次运行状态</tspan></text><text x="36" y="73" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="36" dy="0">Config 提供初值；Dyn 在初始化和后续切换中更新。</tspan></text><rect x="40" y="125" width="300" height="100" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="56" y="154" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="56" dy="0">Config · 常量区</tspan></text><text x="56" y="181" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="56" dy="0">Entry / ReturnAddress</tspan><tspan x="56" dy="24.0">栈边界 / 状态初值</tspan></text><rect x="40" y="278" width="300" height="83" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="56" y="307" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="56" dy="0">启动参数</tspan></text><text x="56" y="334" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="56" dy="0">调用者或 OS 提供</tspan></text><rect x="405" y="160" width="260" height="155" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="421" y="189" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="421" dy="0">初始化 Dyn</tspan></text><text x="421" y="216" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="421" dy="0">PC / LP / SP</tspan><tspan x="421" dy="24.0">PSW / 屏蔽状态</tspan><tspan x="421" dy="24.0">保护字段按实现初始化</tspan></text><rect x="735" y="160" width="265" height="155" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="751" y="189" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="751" dy="0">首次启动 / 后续恢复</tspan></text><text x="751" y="216" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="751" dy="0">硬件状态与软件对象连接</tspan><tspan x="751" dy="24.0">运行中 Dyn 不保证实时同步</tspan><tspan x="751" dy="24.0">栈帧继续承载调用历史</tspan></text><path d="M340,175 L375,175 L375,205 L405,205" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M340,320 L375,320 L375,270 L405,270" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M665,236 L735,236" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><text x="405" y="383" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="405" dy="0">NOINIT 内容必须结合初始化阶段解释。</tspan></text><text x="36" y="450" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="13" font-weight="400"><tspan x="36" dy="0">RH850 / U2A · 机制示意，具体实现与现场需分别核对</tspan></text></svg>