<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc"><title id="title">先按停机事件选取证据</title><desc id="desc">同一会话里的异常、中断和观察点，不自动属于一条因果链。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#237b79"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a13c35"/></marker></defs><rect width="1040" height="570" rx="20" fill="#ffffff"/><path d="M36 91H1004" stroke="#cbdad9"/><text x="36" y="43" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="700"><tspan x="36" dy="0">先按停机事件选取证据</tspan></text><text x="36" y="73" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="36" dy="0">同一会话里的异常、中断和观察点，不自动属于一条因果链。</tspan></text><rect x="338" y="120" width="360" height="75" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="354" y="149" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="354" dy="0">停机原因与当前核 / 运行编号</tspan></text><rect x="40" y="270" width="290" height="100" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="56" y="299" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="56" dy="0">CPU 保护异常</tspan></text><text x="56" y="326" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="56" dy="0">原因、FE / EI 配套状态</tspan><tspan x="56" dy="24.0">原 SP / LP 与访问附加信息</tspan></text><rect x="375" y="270" width="290" height="100" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="391" y="299" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="391" dy="0">ECM 中断</tspan></text><text x="391" y="326" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="391" dy="0">原始源状态、路由</tspan><tspan x="391" dy="24.0">软件掩码与清除动作</tspan></text><rect x="710" y="270" width="290" height="100" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="726" y="299" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="726" dy="0">数据观察点</tspan></text><text x="726" y="326" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="726" dy="0">停机 PC 附近指令</tspan><tspan x="726" dy="24.0">有效地址、宽度与数据</tspan></text><path d="M520,195 L520,230 L185,230 L185,270" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M520,195 L520,230 L520,230 L520,270" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M520,195 L520,230 L855,230 L855,270" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="440" width="600" height="78" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="236" y="469" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="236" dy="0">对齐 ELF / MAP / 镜像，再追踪同一个数据值</tspan></text><path d="M185,370 L185,407 L520,407 L520,440" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M520,370 L520,407 L520,407 L520,440" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M855,370 L855,407 L520,407 L520,440" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="550" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="13" font-weight="400"><tspan x="36" dy="0">RH850 / U2A · 机制示意，具体实现与现场需分别核对</tspan></text></svg>