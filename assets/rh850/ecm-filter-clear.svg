<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc"><title id="title">原始状态怎样变成软件有效位</title><desc id="desc">0x24 / 0x04 是教学数值；同时保留组号才能定位具体错误源。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#237b79"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a13c35"/></marker></defs><rect width="1040" height="580" rx="20" fill="#ffffff"/><path d="M36 91H1004" stroke="#cbdad9"/><text x="36" y="43" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="700"><tspan x="36" dy="0">原始状态怎样变成软件有效位</tspan></text><text x="36" y="73" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="36" dy="0">0x24 / 0x04 是教学数值；同时保留组号才能定位具体错误源。</tspan></text><rect x="42" y="135" width="270" height="150" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="58" y="164" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="58" dy="0">原始状态 R = 0x24</tspan></text><text x="58" y="191" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="58" dy="0">Master 或 Checker 某一组</tspan><tspan x="58" dy="24.0">bit 5 与 bit 2 均置位</tspan></text><rect x="380" y="120" width="280" height="76" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="396" y="149" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="396" dy="0">路径掩码 0x24 → 0x24</tspan></text><rect x="380" y="235" width="280" height="76" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="396" y="264" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="396" dy="0">通知配置 0x04 → 0x04</tspan></text><rect x="380" y="350" width="280" height="76" rx="12" fill="#fff0ed" stroke="#a13c35" stroke-width="1.4"/><text x="396" y="379" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="396" dy="0">类型反码过滤 → 0x00</tspan></text><path d="M312,190 L345,190 L345,158 L380,158" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M520,196 L520,235" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M520,311 L520,350" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="150" width="270" height="124" rx="12" fill="#fff0ed" stroke="#a13c35" stroke-width="1.4"/><text x="746" y="179" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="746" dy="0">结果为零</tspan></text><text x="746" y="206" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="746" dy="0">软件本轮未识别到有效位</tspan><tspan x="746" dy="24.0">原始状态依然可能非零</tspan></text><path d="M660,388 L700,388 L700,212 L730,212" fill="none" stroke="#a13c35" stroke-width="2" marker-end="url(#redarrow)"/><text x="42" y="485" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="42" dy="0">有有效位的正常路径：通知 → 解锁 → 对目标位写 1 → 重新保护</tspan><tspan x="42" dy="27.0">清除后应重新读状态，并检查源模块与待处理中断。</tspan></text><text x="36" y="560" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="13" font-weight="400"><tspan x="36" dy="0">RH850 / U2A · 机制示意，具体实现与现场需分别核对</tspan></text></svg>