<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="670" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc"><title id="title">让 r31 的来源决定下一处观察点</title><desc id="desc">JMP [r31] 直接使用寄存器目标；方括号不是再做一次内存解引用。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#237b79"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a13c35"/></marker></defs><rect width="1040" height="670" rx="20" fill="#ffffff"/><path d="M36 91H1004" stroke="#cbdad9"/><text x="36" y="43" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="700"><tspan x="36" dy="0">让 r31 的来源决定下一处观察点</tspan></text><text x="36" y="73" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="36" dy="0">JMP [r31] 直接使用寄存器目标；方括号不是再做一次内存解引用。</tspan></text><rect x="335" y="120" width="370" height="78" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="351" y="149" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="351" dy="0">跳转前 r31 已是异常目标</tspan></text><rect x="40" y="288" width="290" height="110" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="56" y="317" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="56" dy="0">从栈恢复</tspan></text><text x="56" y="344" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="56" dy="0">计算加载的有效地址</tspan><tspan x="56" dy="24.0">再检查该字的最后写入者</tspan></text><rect x="375" y="288" width="290" height="110" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="391" y="317" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="391" dy="0">从 Context.LP 恢复</tspan></text><text x="391" y="344" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="391" dy="0">确认对象身份与字段地址</tspan><tspan x="391" dy="24.0">再检查该字段的写入者</tspan></text><rect x="710" y="288" width="290" height="110" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="726" y="317" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="726" dy="0">其他寄存器 / 运算来源</tspan></text><text x="726" y="344" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="726" dy="0">继续追前一条赋值</tspan><tspan x="726" dy="24.0">核对指针和控制路径</tspan></text><path d="M520,198 L520,245 L185,245 L185,288" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M520,198 L520,245 L520,245 L520,288" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M520,198 L520,245 L855,245 L855,288" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><rect x="145" y="485" width="750" height="105" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="161" y="514" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="161" dy="0">同一次运行中连起数据传播</tspan></text><text x="161" y="541" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="161" dy="0">写入源字 → 加载进 r31 → 使用该目标 → 对应异常现场</tspan></text><path d="M185,398 L185,443 L520,443 L520,485" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M520,398 L520,443 L520,443 L520,485" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><path d="M855,398 L855,443 L520,443 L520,485" fill="none" stroke="#237b79" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="650" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="13" font-weight="400"><tspan x="36" dy="0">RH850 / U2A · 机制示意，具体实现与现场需分别核对</tspan></text></svg>