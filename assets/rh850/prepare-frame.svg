<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" role="img" aria-labelledby="title desc"><title id="title">PREPARE 的保存区与局部空间</title><desc id="desc">假设执行前 S = B−4；11 个寄存器保存 44 字节，再分配 124 字节。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#237b79"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a13c35"/></marker></defs><rect width="1040" height="720" rx="20" fill="#ffffff"/><path d="M36 91H1004" stroke="#cbdad9"/><text x="36" y="43" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="27" font-weight="700"><tspan x="36" dy="0">PREPARE 的保存区与局部空间</tspan></text><text x="36" y="73" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="36" dy="0">假设执行前 S = B−4；11 个寄存器保存 44 字节，再分配 124 字节。</tspan></text><rect x="45" y="120" width="660" height="44" fill="#eef6f4" stroke="#cbdad9"/><text x="58" y="149" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="58" dy="0">S−4</tspan></text><text x="195" y="149" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="195" dy="0">r20</tspan></text><text x="350" y="149" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">B−0x08 · 观察区间内</tspan></text><rect x="45" y="168" width="660" height="44" fill="#eef6f4" stroke="#cbdad9"/><text x="58" y="197" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="58" dy="0">S−8</tspan></text><text x="195" y="197" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="195" dy="0">r21</tspan></text><text x="350" y="197" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">B−0x0C · 观察区间内</tspan></text><rect x="45" y="216" width="660" height="44" fill="#ffffff" stroke="#cbdad9"/><text x="58" y="245" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="58" dy="0">…</tspan></text><text x="195" y="245" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="195" dy="0">r22–r25</tspan></text><text x="350" y="245" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">中间保存字</tspan></text><rect x="45" y="264" width="660" height="44" fill="#fbf3e7" stroke="#cbdad9"/><text x="58" y="293" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="58" dy="0">S−28</tspan></text><text x="195" y="293" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="195" dy="0">r26</tspan></text><text x="350" y="293" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">B−0x20 · 数据指针 P</tspan></text><rect x="45" y="312" width="660" height="44" fill="#fbf3e7" stroke="#cbdad9"/><text x="58" y="341" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="58" dy="0">S−32</tspan></text><text x="195" y="341" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="195" dy="0">r27</tspan></text><text x="350" y="341" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">B−0x24 · 数据指针 Q</tspan></text><rect x="45" y="360" width="660" height="44" fill="#fbf3e7" stroke="#cbdad9"/><text x="58" y="389" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="58" dy="0">S−36</tspan></text><text x="195" y="389" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="195" dy="0">r28</tspan></text><text x="350" y="389" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">B−0x28 · 数据指针 P</tspan></text><rect x="45" y="408" width="660" height="44" fill="#fbf3e7" stroke="#cbdad9"/><text x="58" y="437" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="58" dy="0">S−40</tspan></text><text x="195" y="437" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="195" dy="0">r29</tspan></text><text x="350" y="437" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">B−0x2C · 数据指针 Q</tspan></text><rect x="45" y="456" width="660" height="44" fill="#ffffff" stroke="#cbdad9"/><text x="58" y="485" text-anchor="start" fill="#3a6598" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="58" dy="0">S−44</tspan></text><text x="195" y="485" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="600"><tspan x="195" dy="0">lp / r31</tspan></text><text x="350" y="485" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="350" dy="0">B−0x30 · 此帧保存的 LP</tspan></text><rect x="45" y="512" width="660" height="94" fill="#eef6f4" stroke="#cbdad9"/><text x="66" y="547" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="400"><tspan x="66" dy="0">局部变量与临时空间：31 × 4 = 124 字节</tspan></text><text x="66" y="580" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="18" font-weight="400"><tspan x="66" dy="0">完整执行后 SP = S−0xA8 = B−0xAC</tspan></text><rect x="753" y="145" width="245" height="115" rx="12" fill="#eef6f4" stroke="#237b79" stroke-width="1.4"/><text x="769" y="174" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="769" dy="0">TaskA 的正常保存</tspan></text><text x="769" y="201" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="769" dy="0">P 可是 Context 对象地址</tspan><tspan x="769" dy="24.0">数据指针上栈本身正常</tspan></text><rect x="753" y="335" width="245" height="145" rx="12" fill="#fff0ed" stroke="#a13c35" stroke-width="1.4"/><text x="769" y="364" text-anchor="start" fill="#163c45" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="19" font-weight="600"><tspan x="769" dy="0">TaskB 是否使用这些槽？</tspan></text><text x="769" y="391" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="16" font-weight="400"><tspan x="769" dy="0">必须确认它的恢复指令</tspan><tspan x="769" dy="24.0">以及真正的源字位置。</tspan><tspan x="769" dy="24.0">相同数值不等于返回链。</tspan></text><text x="45" y="657" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="17" font-weight="400"><tspan x="45" dy="0">此图假设指令完整执行；若指令被打断，需另查重执行语义。</tspan></text><text x="36" y="700" text-anchor="start" fill="#526a70" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="13" font-weight="400"><tspan x="36" dy="0">RH850 / U2A · 机制示意，具体实现与现场需分别核对</tspan></text></svg>