<text x="78" y="205" class="white">App_Acquisition</text><text x="334" y="205" class="white">App_Diagnostics</text><text x="658" y="205" class="white">App_Control</text>
<text x="81" y="255" class="body">Task_Sample_10ms</text><text x="81" y="290" class="small">周期采集：10 ms</text><text x="81" y="322" class="small">关联：ADC 中断</text><text x="81" y="354" class="small">输出：SampleFrame</text>
<text x="332" y="255" class="body">Task_Diag_100ms</text><text x="332" y="290" class="small">周期诊断：100 ms</text><text x="332" y="322" class="small">只读取状态摘要</text>
<text x="661" y="255" class="body">Task_Control_10ms</text><text x="661" y="290" class="small">周期控制：10 ms</text><text x="661" y="322" class="small">接收并验证 SampleFrame</text><text x="661" y="354" class="small">输出：控制状态</text>
