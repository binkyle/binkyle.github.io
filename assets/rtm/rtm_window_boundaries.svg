<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img"><rect width="100%" height="100%" fill="#f8fafc" /><style>text{font-family:Arial,sans-serif;fill:#0f172a} .title{font-size:24px;font-weight:bold} .label{font-size:17px} .small{font-size:14px;fill:#475569}</style><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5" /></marker></defs><text x="35" y="43" class="title" text-anchor="start" font-family="Arial,sans-serif" font-size="24" fill="#0f172a" font-weight="bold">Window closure without any Task switches</text><text x="45" y="128" class="label" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Idle</text><rect x="130.0" y="90" width="328.0" height="62" rx="9" fill="#dbeafe" stroke="#94a3b8" /><text x="294.0" y="127.0" class="label" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Window 0: Idle 100</text><rect x="460.0" y="90" width="328.0" height="62" rx="9" fill="#dcfce7" stroke="#94a3b8" /><text x="624.0" y="127.0" class="label" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Window 1: Idle 100</text><rect x="790.0" y="90" width="163.0" height="62" rx="9" fill="#fef3c7" stroke="#94a3b8" /><text x="871.5" y="127.0" class="label" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Partial: 50</text><line x1="130.0" y1="80" x2="130.0" y2="200" stroke="#64748b" stroke-dasharray="4,4" /><text x="130.0" y="224" class="small" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">0 ms</text><line x1="460.0" y1="80" x2="460.0" y2="200" stroke="#64748b" stroke-dasharray="4,4" /><text x="460.0" y="224" class="small" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">100 ms</text><text x="460.0" y="262" class="small" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">poll / snapshot</text><line x1="790.0" y1="80" x2="790.0" y2="200" stroke="#64748b" stroke-dasharray="4,4" /><text x="790.0" y="224" class="small" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">200 ms</text><text x="790.0" y="262" class="small" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">poll / snapshot</text><line x1="955.0" y1="80" x2="955.0" y2="200" stroke="#64748b" stroke-dasharray="4,4" /><text x="955.0" y="224" class="small" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">250 ms</text><text x="955.0" y="262" class="small" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">poll / snapshot</text><text x="40" y="326" class="label" text-anchor="start" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Execution stays in Idle; periodic samples close exact logical boundaries.</text><text x="40" y="366" class="small" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#475569">Calls must stay within max_gap; a window is not a safe timer sampling gap.</text><text x="40" y="407" class="small" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#475569">The engine retains the partial and latest complete window; the reporter stores history.</text></svg>