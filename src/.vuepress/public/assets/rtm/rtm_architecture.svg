<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
  <title id="title">Independent time and stack observation with copied results</title>
  <desc id="desc">Serialized time events feed a per-core time engine and optional trace. Owned offline memory or an authorized OS query feeds an independent stack observer. Both publish copied statistics through the report layer.</desc>
  <rect width="1040" height="540" rx="12" fill="#f8fafc"/>
  <style>text{font-family:Arial,sans-serif;fill:#0f172a}.title{font-size:26px;font-weight:700}.label{font-size:22px}.small{font-size:18px;fill:#475569}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
  <text x="34" y="45" class="title">Runtime Observer: time and stack resources</text>
  <rect x="40" y="78" width="440" height="74" rx="10" fill="#e0e7ff" stroke="#94a3b8"/>
  <text x="260" y="110" text-anchor="middle" class="label">OS / Timer / Core ID port</text>
  <text x="260" y="139" text-anchor="middle" class="small">Serialized timestamped events</text>
  <rect x="560" y="78" width="440" height="74" rx="10" fill="#e0e7ff" stroke="#94a3b8"/>
  <text x="780" y="110" text-anchor="middle" class="label">Owned memory / authorized OS query</text>
  <text x="780" y="139" text-anchor="middle" class="small">Physical-region identity and source contract</text>
  <path d="M260 152 V184 M780 152 V184" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="186" width="440" height="82" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
  <text x="260" y="221" text-anchor="middle" class="label">Time engine / per-core state</text>
  <text x="260" y="252" text-anchor="middle" class="small">Task · Idle · ISR · Kernel · function points</text>
  <rect x="560" y="186" width="440" height="82" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
  <text x="780" y="221" text-anchor="middle" class="label">Independent Stack Observer</text>
  <text x="780" y="252" text-anchor="middle" class="small">Watermark scan OR OS-unit normalization</text>
  <path d="M260 268 V300 M780 268 V300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="302" width="440" height="72" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
  <text x="260" y="335" text-anchor="middle" class="label">CPU Load / timing statistics</text>
  <text x="260" y="363" text-anchor="middle" class="small">Optional Trace → Host export</text>
  <rect x="560" y="302" width="440" height="72" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
  <text x="780" y="335" text-anchor="middle" class="label">Capacity / Peak / Remaining</text>
  <text x="780" y="363" text-anchor="middle" class="small">Validity · warning · optional guard</text>
  <path d="M260 374 V414 H520 V432 M780 374 V414 H520" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M520 421 V434" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="218" y="438" width="604" height="60" rx="10" fill="#fef3c7" stroke="#94a3b8"/>
  <text x="520" y="475" text-anchor="middle" class="label">Copied results → report task / IOC / Host</text>
  <text x="520" y="526" text-anchor="middle" class="small">Caller-owned C99 libraries; no heap; Stack Observer needs no Trace or time engine</text>
</svg>
